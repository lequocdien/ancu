<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An Cư Preview</title>
<style>
:root{
  --primary:#0D9488; --primary-2:#14B8A6; --accent:#FF5A3C;
  --open:#10B981; --soon:#F59E0B; --closed:#94A3B8; --building:#6366F1;
  --ring:#F97316; --exp:#A855F7; --m1:#EF4444; --m2:#3B82F6; --mx:#22C55E;
  --text:#0F172A; --text-2:#475569; --text-3:#94A3B8;
  --page:#E9EEF2; --solid:rgba(255,255,255,.72); --solid-border:rgba(15,23,42,.06);
  --glass-bg:rgba(255,255,255,.38); --glass-border:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.95); --glass-shadow:rgba(15,23,42,.14);
  --land:#EEF1EC; --land-2:#E4EAE2; --water:#BFDDEB; --road:#FFFFFF; --road-2:#D9DEE3; --park:#D6E8CF;
  --mesh-a:#CCFBF1; --mesh-b:#F0FDFA; --mesh-c:#FFE4DC; --mesh-d:#99F6E4;
}
body.dark{
  --primary:#2DD4BF; --primary-2:#14B8A6; --accent:#FF7A5C;
  --open:#34D399; --soon:#FBBF24; --closed:#64748B; --building:#818CF8;
  --text:#F1F5F9; --text-2:#CBD5E1; --text-3:#64748B;
  --page:#05080F; --solid:rgba(30,41,59,.72); --solid-border:rgba(255,255,255,.06);
  --glass-bg:rgba(30,41,59,.38); --glass-border:rgba(255,255,255,.16);
  --glass-hi:rgba(255,255,255,.28); --glass-shadow:rgba(0,0,0,.5);
  --land:#141C26; --land-2:#18222E; --water:#0F2C3D; --road:#273444; --road-2:#1E2A38; --park:#132A22;
  --mesh-a:#042F2E; --mesh-b:#0B1120; --mesh-c:#3B1A12; --mesh-d:#064E46;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;background:var(--page);color:var(--text);
  -webkit-font-smoothing:antialiased;padding:40px 40px 48px}
.num{font-variant-numeric:tabular-nums}
header.page{display:flex;align-items:baseline;gap:16px;margin-bottom:28px}
header.page h1{font-size:26px;letter-spacing:-.02em}
header.page p{color:var(--text-2);font-size:15px}
.row{display:flex;gap:36px;flex-wrap:wrap}
figure{display:flex;flex-direction:column;align-items:center;gap:14px}
figcaption{font-size:14px;color:var(--text-2);font-weight:600}

/* ---------- phone ---------- */
.phone{width:393px;height:852px;border-radius:56px;position:relative;overflow:hidden;
  box-shadow:0 0 0 11px #11151C,0 0 0 12.5px #3A404A,0 30px 60px rgba(0,0,0,.28);background:var(--land)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:50}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;
  padding:6px 34px 0 46px;font-weight:600;font-size:16.5px;z-index:40;color:var(--text)}
.status .ic{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:var(--text);opacity:.85;z-index:60}

/* ---------- liquid glass ---------- */
.glass{position:relative;background:var(--glass-bg);
  backdrop-filter:blur(14px) saturate(190%) brightness(1.04);-webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.04);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.18),0 10px 28px -6px var(--glass-shadow),0 2px 6px -2px var(--glass-shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.18) 100%);opacity:.6}
body.dark .glass::before{opacity:.18}
.glass.tint{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 78%,transparent),color-mix(in srgb,var(--primary-2) 62%,transparent));
  border-color:rgba(255,255,255,.45);color:#fff}
.solid{background:var(--solid);border:1px solid var(--solid-border);border-radius:20px}

/* ---------- map ---------- */
.map{position:absolute;inset:0}
.top-ui{position:absolute;top:58px;left:16px;right:16px;z-index:20;display:flex;flex-direction:column;gap:10px}
.search{height:50px;border-radius:25px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;font-size:16px;color:var(--text-2)}
.search .grow{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#0EA5E9);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:700}
.seg{height:36px;border-radius:18px;display:flex;padding:3px;font-size:13.5px;font-weight:600}
.seg span{flex:1;display:grid;place-items:center;border-radius:15px;color:var(--text-2)}
.seg span.on{background:var(--solid);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.12)}
body.dark .seg span.on{background:rgba(255,255,255,.16)}
.chips{display:flex;gap:8px;overflow:hidden;margin-right:-16px}
.chip{height:34px;border-radius:17px;padding:0 13px;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--text)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.on{color:#fff}
.fab-col{position:absolute;right:16px;top:262px;z-index:20;display:flex;flex-direction:column;border-radius:24px;overflow:hidden}
.fab-col div{width:48px;height:48px;display:grid;place-items:center;color:var(--text)}
.fab-col div+div{border-top:1px solid var(--glass-border)}

.pin{position:absolute;z-index:10;transform:translate(-50%,-50%)}
.pin .dot{width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,.28);color:#fff}
.pin.sel .dot{width:44px;height:44px;border-width:3px;box-shadow:0 0 0 6px color-mix(in srgb,var(--open) 30%,transparent),0 6px 14px rgba(0,0,0,.3)}
.pin.cluster .dot{width:38px;height:38px;font-size:13px;font-weight:700;background:var(--primary)}
.pin.pulse::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--open);opacity:.5}
.lbl{position:absolute;z-index:9;font-size:10.5px;font-weight:600;color:var(--text-2);transform:translate(-50%,0);white-space:nowrap;
  text-shadow:0 0 3px var(--land),0 0 3px var(--land)}

/* ---------- sheet ---------- */
.sheet{position:absolute;left:8px;right:8px;bottom:8px;height:478px;border-radius:38px;z-index:30;padding:10px 18px 20px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--text-3);opacity:.6;margin:0 auto 12px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh-head h2{font-size:21px;letter-spacing:-.02em;line-height:1.2}
.sh-head p{font-size:13.5px;color:var(--text-2);margin-top:3px}
.close{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text-2)}
.badges{display:flex;gap:8px;margin:12px 0 14px}
.badge{height:26px;border-radius:13px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.badge.open{background:color-mix(in srgb,var(--open) 16%,transparent);color:var(--open)}
.badge.hot{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.badge.soon{background:color-mix(in srgb,var(--soon) 18%,transparent);color:var(--soon)}
.badge.closed{background:color-mix(in srgb,var(--closed) 22%,transparent);color:var(--text-2)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:11px 13px;border-radius:18px}
.tile small{display:block;font-size:12px;color:var(--text-2);font-weight:500}
.tile b{display:block;font-size:17.5px;margin-top:3px;letter-spacing:-.01em}
.tile b em{font-style:normal;font-size:12.5px;color:var(--text-2);font-weight:500}
.conn{margin-top:8px;padding:10px 13px;border-radius:18px;display:flex;flex-direction:column;gap:8px}
.conn .r{display:flex;align-items:center;gap:10px;font-size:13.5px}
.conn .r i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;font-style:normal;font-size:11px;font-weight:800}
.conn .r span{flex:1}
.conn .r b{font-size:13.5px}
.conn .note{font-size:11px;color:var(--text-3)}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;font-size:16px}
.btn.g{flex:0 0 108px;color:var(--text)}
.btn.p{flex:1}
.src{font-size:11.5px;color:var(--text-3);margin-top:10px;display:flex;justify-content:space-between}
.src a{color:var(--accent);font-weight:600;text-decoration:none}

/* ---------- mesh screens ---------- */
.mesh{position:absolute;inset:0;
  background:
   radial-gradient(60% 45% at 12% 8%,var(--mesh-d) 0%,transparent 70%),
   radial-gradient(55% 40% at 95% 30%,var(--mesh-c) 0%,transparent 70%),
   radial-gradient(70% 50% at 20% 75%,var(--mesh-a) 0%,transparent 70%),
   radial-gradient(60% 45% at 90% 95%,var(--mesh-c) 0%,transparent 70%),
   var(--mesh-b)}
.scr{position:absolute;inset:0;padding:60px 16px 0;z-index:5}
.nav{display:flex;justify-content:space-between;align-items:center;height:44px}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.ltitle{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:6px 4px 14px}
.seg3{height:38px;border-radius:19px;display:flex;padding:3px;font-size:13.5px;font-weight:600;margin-bottom:16px}
.seg3 span{flex:1;display:grid;place-items:center;border-radius:16px;color:var(--text-2)}
.seg3 span.on{background:var(--solid);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.1)}
body.dark .seg3 span.on{background:rgba(255,255,255,.16)}
.card{border-radius:26px;padding:14px 15px;margin-bottom:12px}
.card .t{display:flex;justify-content:space-between;align-items:center}
.card h3{font-size:16.5px;letter-spacing:-.01em}
.card .sub{font-size:12.5px;color:var(--text-2);margin-top:2px}
.card .meta{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--text-2)}
.card .meta b{color:var(--text);font-weight:650}
.bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--text-3) 30%,transparent);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--text-3);flex:none}
.check.on{background:var(--primary);border-color:var(--primary);display:grid;place-items:center;color:#fff}
.tabbar{position:absolute;left:24px;right:24px;bottom:28px;height:62px;border-radius:31px;z-index:30;display:flex;padding:5px}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--text);border-radius:26px}
.tabbar div.on{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.float-cta{position:absolute;left:24px;right:24px;bottom:104px;z-index:30}

/* eligibility */
.prog{display:flex;gap:5px;margin:10px 4px 16px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--primary)}
.result{border-radius:30px;padding:22px 18px 18px;text-align:center}
.big{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--open),#0EA5E9);box-shadow:0 10px 24px -6px color-mix(in srgb,var(--open) 60%,transparent)}
.result h2{font-size:24px;letter-spacing:-.02em}
.result p{font-size:13.5px;color:var(--text-2);margin-top:6px;line-height:1.45}
.crit{margin-top:14px;text-align:left;padding:4px 12px;border-radius:18px}
.crit .r{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px}
.crit .r+.r{border-top:1px solid var(--solid-border)}
.crit .r span{flex:1;color:var(--text-2)}
.crit .r b{font-weight:650}
.ok{color:var(--open)} .warn{color:var(--soon)}
.mock{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:1px 4px;margin-left:4px}
.cites{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.cites span{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:10px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.disc{margin-top:12px;font-size:12px;color:var(--text-2);line-height:1.45;padding:11px 13px;border-radius:16px;text-align:left;display:flex;gap:8px}
.lock{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--text-2);margin-top:12px}

/* account */
.prof{border-radius:28px;padding:16px;display:flex;gap:14px;align-items:center}
.prof .av{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#0EA5E9);display:grid;place-items:center;color:#fff;font-weight:800;font-size:21px}
.prof h3{font-size:18px}
.prof p{font-size:13px;color:var(--text-2);margin-top:2px;display:flex;align-items:center;gap:5px}
.elig{border-radius:28px;padding:18px;margin-top:14px;overflow:hidden}
.elig h3{font-size:19px;letter-spacing:-.01em}
.elig p{font-size:13px;opacity:.9;margin-top:4px;line-height:1.4}
.elig .go{margin-top:14px;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:19px;background:rgba(255,255,255,.92);color:#0F766E;font-weight:700;font-size:14px}
.elig .deco{position:absolute;right:-16px;top:-10px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.list{border-radius:22px;margin-top:14px;padding:0 14px}
.list .r{display:flex;align-items:center;gap:12px;height:50px;font-size:15px}
.list .r+.r{border-top:1px solid var(--solid-border)}
.list .r i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.list .r span{flex:1}
.list .r .chev{color:var(--text-3)}
.danger{color:#EF4444;font-weight:600}
svg{display:block}
</style>
</head>

  </defs>
</svg>

<header class="page">
  <h1>An Cư · Prototype preview</h1>
  <p id="mode-label">Liquid Glass · Light mode · iOS 26 (iOS 17–25 dùng fallback material)</p>
</header>

<div class="row">

<!-- ================= 1. MAP ================= -->
<figure>
<div class="phone">
  <div class="island"></div>
  <div class="status"><span class="num">9:41</span><span class="ic"><svg width="18" height="14"><use href="#i-wifi"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>

  <svg class="map" viewBox="0 0 393 852" preserveAspectRatio="xMidYMid slice">
    <rect width="393" height="852" fill="var(--land)"/>
    <!-- districts patches -->
    <path d="M0 470 L120 430 L210 470 L200 600 L60 640 L0 610Z" fill="var(--land-2)"/>
    <path d="M230 120 L393 90 L393 330 L290 360 L240 270Z" fill="var(--land-2)"/>
    <ellipse cx="120" cy="250" rx="60" ry="36" fill="var(--park)"/>
    <ellipse cx="330" cy="560" rx="70" ry="44" fill="var(--park)"/>
    <!-- rivers: Sài Gòn & Đồng Nai -->
    <path d="M150 0 C170 120 120 200 175 300 C215 370 185 430 230 500 C270 560 250 640 300 720 C330 770 320 820 340 852" fill="none" stroke="var(--water)" stroke-width="16" stroke-linecap="round"/>
    <path d="M393 260 C340 300 330 360 290 400 C262 430 250 470 236 505" fill="none" stroke="var(--water)" stroke-width="13" stroke-linecap="round"/>
    <!-- minor roads -->
    <g stroke="var(--road-2)" stroke-width="3" fill="none">
      <path d="M0 330 L393 300"/><path d="M0 560 L393 520"/><path d="M60 0 L90 852"/><path d="M270 0 L250 852"/>
      <path d="M0 190 L393 160"/><path d="M0 700 L393 680"/><path d="M200 0 L330 852"/>
    </g>
    <!-- Quốc lộ -->
    <path d="M0 420 C120 400 220 360 393 330" fill="none" stroke="var(--road)" stroke-width="7"/>
